<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>JURIS_PULSE · Consulta Quirúrgica</title>

    <!-- Font Awesome (iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- CSS propio (ruta absoluta) -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-modo="filtros">

    <!-- ==================================================================
         ENCABEZADO
         ================================================================== -->
    <header>
        <h1 class="logo">
            <span>JURIS</span><span class="pulse">_PULSE</span>
        </h1>
    </header>

    <!-- ==================================================================
         CONTENEDOR PRINCIPAL
         ================================================================== -->
    <div class="contenedor">

        <!-- ---------- PESTAÑAS DE MODO ---------- -->
        <div class="pestanas">
            <button class="pestana activa" id="pestanaFiltros" data-modo="filtros">
                <i class="fas fa-filter"></i> Filtros
            </button>
            <button class="pestana" id="pestanaSemantica" data-modo="semantico">
                <i class="fas fa-brain"></i> Semántica
            </button>
        </div>

        <!-- ---------- MENSAJE CONTEXTUAL ---------- -->
        <div class="mensaje-contextual" id="mensajeContextual">
            Explora el corpus por tipo, materia y texto.
        </div>

        <!-- ---------- FILTROS (SIEMPRE VISIBLES) ---------- -->
        <div class="grid-filtros">
            <select id="filtroTipo" class="selector">
                <option value="todas">📋 Todas las Tesis</option>
                <option value="Jurisprudencia">⚖️ Jurisprudencia</option>
                <option value="Aislada">📄 Aislada</option>
            </select>

            <select id="filtroMateria" class="selector">
                <option value="todas">📚 Materia: Todas</option>
                <option value="Penal">Penal</option>
                <option value="Civil">Civil</option>
                <option value="Administrativa">Administrativa</option>
                <option value="Constitucional">Constitucional</option>
                <option value="Laboral">Laboral</option>
                <option value="Común">Común</option>
            </select>
        </div>

        <!-- ---------- CAJA DE BÚSQUEDA LOCAL (MODO FILTROS) ---------- -->
        <div class="caja-busqueda" id="cajaLocal">
            <i class="fas fa-search icono-buscar"></i>
            <input
                type="text"
                id="filtroBusqueda"
                placeholder="Buscar por rubro o resumen..."
            >
        </div>

        <!-- ---------- CAJA SEMÁNTICA (MODO SEMÁNTICO) ---------- -->
        <div class="caja-semantica" id="cajaSemantica" style="display:none;">
            <textarea
                id="consultaSemantica"
                placeholder="Ej: ¿cómo impugnar un acto de autoridad que viola derechos humanos?"
            ></textarea>
            <div class="boton-semantica">
                <button class="btn-buscar-semantica" id="btnBuscarSemantica">
                    <i class="fas fa-brain"></i> Buscar por significado
                </button>
                <div class="contador-busquedas" id="contadorBusquedas">
                    20/20
                </div>
            </div>
        </div>

        <!-- ---------- MÉTRICAS ---------- -->
        <div class="dashboard-metricas">
            <div class="dashboard-titulo">📊 MÉTRICAS DE FILTRADO</div>
            <div class="grid-metricas">
                <div class="metrica">
                    <div class="metrica-label">Restantes</div>
                    <div class="metrica-valor dorado" id="relojRestantes">...</div>
                </div>
                <div class="metrica">
                    <div class="metrica-label">Juris</div>
                    <div class="metrica-valor" id="relojJuris">...</div>
                </div>
                <div class="metrica">
                    <div class="metrica-label">Aisladas</div>
                    <div class="metrica-valor" id="relojAisladas">...</div>
                </div>
            </div>
        </div>

        <!-- ---------- LISTADO DE TESIS ---------- -->
        <div class="listado" id="listadoContainer">
            <div class="estado-cargando">
                <i class="fas fa-circle-notch fa-spin" style="color:#f59e0b;"></i>
                Conectando al backend...
            </div>
        </div>

    </div>

    <!-- ==================================================================
         CORTINA DE DETALLE
         ================================================================== -->
    <div class="cortina oculta" id="cortinaDetalle">
        <div class="cortina-contenido">
            <div class="cortina-tirador"></div>

            <div class="cortina-scroll">
                <div class="cortina-header">
                    <div class="cortina-badges">
                        <span id="detBadgeTipo">...</span>
                        <span id="detBadgeMateria">...</span>
                    </div>
                    <h2 class="cortina-rubro" id="detRubro">Cargando...</h2>
                    <div class="cortina-meta">
                        <span>📌 REG: <span id="detReg">...</span></span>
                        <span id="detFecha">...</span>
                    </div>
                </div>

                <div class="cortina-texto" id="detTextoContenedor">Cargando...</div>
            </div>

            <div class="botonera">
                <button class="btn btn-volver" id="btnCerrarCortina">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <button class="btn btn-copiar" id="btnCopiarTexto">
                    <i class="fas fa-copy"></i> Copiar Tesis
                </button>
            </div>
        </div>
    </div>

    <!-- ==================================================================
         FOOTER
         ================================================================== -->
    <footer>
        © 2026 JURIS_PULSE · Consulta Quirúrgica
    </footer>

    <!-- SCRIPT (ruta absoluta) -->
    <script src="/static/js/script.js" defer></script>

</body>
</html>
