<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test · Copiar al portapapeles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #020617;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            padding: 24px;
            max-width: 720px;
            margin: 0 auto;
        }

        h1 { font-size: 20px; margin-bottom: 6px; color: #a78bfa; }
        .subtitulo { color: #94a3b8; font-size: 12px; margin-bottom: 24px; }

        button {
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 8px;
            margin-right: 8px;
        }

        button:hover { opacity: 0.9; }

        .info { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }

        .log {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px 14px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 16px;
            margin-bottom: 16px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .log .ok { color: #4ade80; }
        .log .warn { color: #fbbf24; }
        .log .err { color: #f87171; }
        .log .info { color: #94a3b8; }

        textarea {
            width: 100%;
            min-height: 100px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            margin-top: 8px;
        }

        .resultado {
            margin-top: 24px;
            padding: 16px;
            background: #0f172a;
            border-left: 4px solid #8b5cf6;
            border-radius: 8px;
            font-size: 13px;
        }

        .resultado h2 { font-size: 14px; margin-bottom: 8px; color: #a78bfa; }

        .status-lista {
            list-style: none;
            padding: 0;
            margin-top: 12px;
        }

        .status-lista li {
            padding: 6px 0;
            font-size: 13px;
        }

        .status-lista .check { color: #4ade80; margin-right: 6px; }
        .status-lista .cross { color: #f87171; margin-right: 6px; }
    </style>
</head>
<body>

    <h1>Test · Copiar al portapapeles</h1>
    <p class="subtitulo">Verificamos si el copiado funciona en este navegador y contexto.</p>

    <div class="resultado">
        <h2>Estado del navegador</h2>
        <ul class="status-lista" id="estado"></ul>
    </div>

    <div class="resultado">
        <h2>Acciones</h2>
        <button id="btnCopiar">📋 Copiar texto de prueba</button>
        <button id="btnLimpiar">🧹 Limpiar log</button>
        <p class="info">Presiona "Copiar" y luego pega abajo con Ctrl+V (o mantén presionado en móvil).</p>
        <textarea id="verificador" placeholder="Pega aquí con Ctrl+V para verificar que se copió..."></textarea>
    </div>

    <div class="log" id="log"></div>

    <script>
        const log = document.getElementById('log');

        function escribir(mensaje, tipo = 'info') {
            const ahora = new Date().toLocaleTimeString();
            log.innerHTML += `<span class="${tipo}">[${ahora}] ${mensaje}</span>\n`;
            log.scrollTop = log.scrollHeight;
        }

        // ---- Diagnóstico inicial ----
        const estado = document.getElementById('estado');
        const checks = [
            ['Contexto seguro (HTTPS o localhost)', window.isSecureContext],
            ['API navigator.clipboard disponible', !!(navigator.clipboard && navigator.clipboard.writeText)],
            ['document.execCommand disponible', typeof document.execCommand === 'function'],
            ['Protocolo', window.location.protocol],
            ['Host', window.location.host],
        ];
        checks.forEach(([nombre, valor]) => {
            const li = document.createElement('li');
            const esBool = typeof valor === 'boolean';
            const icono = esBool ? (valor ? '<span class="check">✅</span>' : '<span class="cross">❌</span>') : 'ℹ️ ';
            li.innerHTML = `${icono}<strong>${nombre}:</strong> ${valor}`;
            estado.appendChild(li);
        });

        escribir('Test iniciado.', 'info');
        escribir(`URL: ${window.location.href}`, 'info');

        // ============================================================
        // LÓGICA DE COPIADO (idéntica a la que vamos a usar en la app)
        // ============================================================
        const TEXTO_PRUEBA = `Registro digital: 2032635
Tipo: Jurisprudencia
Materia: Administrativa
Época: Duodécima Época
Instancia: Pleno
Clave de tesis: PC.XIX. J/19 C (10a.)
Expediente: N/A
Fecha de publicación: 11 de septiembre de 2026

────────────────────

TRANSPORTE PARA EL ESTADO DE BAJA CALIFORNIA SUR. LOS ARTÍCULOS 6o., 47, 47 BIS Y 47 TER DEL REGLAMENTO DE LA LEY RELATIVA CONSTITUYEN UN SISTEMA NORMATIVO QUE REGULA LA ACTIVIDAD DE TRANSPORTE TURÍSTICO LOCAL, SUJETO A UN PERMISO EVENTUAL.

────────────────────

SÍNTESIS IA

El Reglamento de la Ley de Transporte para el Estado de Baja California Sur establece, a través de sus artículos 6o., 47, 47 BIS y 47 TER, un sistema normativo que regula la actividad de transporte turístico local.

──────────── FIN DE LA PRUEBA ────────────`;

        function copiarConExecCommand(texto) {
            try {
                const ta = document.createElement('textarea');
                ta.value = texto;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, texto.length);
                const exito = document.execCommand('copy');
                document.body.removeChild(ta);
                return exito;
            } catch (err) {
                escribir(`execCommand lanzó excepción: ${err.message}`, 'err');
                return false;
            }
        }

        document.getElementById('btnCopiar').addEventListener('click', () => {
            escribir('─── Click en Copiar ───', 'info');

            // Estrategia 1: API moderna
            if (navigator.clipboard && window.isSecureContext) {
                escribir('Intentando: navigator.clipboard.writeText()', 'info');
                navigator.clipboard.writeText(TEXTO_PRUEBA).then(
                    () => {
                        escribir('✅ ÉXITO con navigator.clipboard', 'ok');
                        escribir('Ahora pega en el textarea para verificar.', 'info');
                    },
                    (err) => {
                        escribir(`❌ Falló navigator.clipboard: ${err.message}`, 'warn');
                        escribir('Reintentando con execCommand...', 'info');
                        const exito = copiarConExecCommand(TEXTO_PRUEBA);
                        if (exito) {
                            escribir('✅ ÉXITO con execCommand', 'ok');
                            escribir('Ahora pega en el textarea para verificar.', 'info');
                        } else {
                            escribir('❌ También falló execCommand.', 'err');
                            escribir('Se abriría el modal fallback en la app.', 'warn');
                        }
                    }
                );
                return;
            }

            // Estrategia 2: execCommand (contexto no seguro)
            escribir('Contexto NO seguro, usando execCommand directamente.', 'info');
            const exito = copiarConExecCommand(TEXTO_PRUEBA);
            if (exito) {
                escribir('✅ ÉXITO con execCommand', 'ok');
                escribir('Ahora pega en el textarea para verificar.', 'info');
            } else {
                escribir('❌ Falló execCommand.', 'err');
                escribir('Se abriría el modal fallback en la app.', 'warn');
            }
        });

        document.getElementById('btnLimpiar').addEventListener('click', () => {
            log.innerHTML = '';
            document.getElementById('verificador').value = '';
            escribir('Log limpio.', 'info');
        });
    </script>

</body>
</html>
